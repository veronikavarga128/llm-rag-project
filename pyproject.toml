[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-rag-project"
version = "0.1.0"
description = "RAG-rendszer építése és kiértékelése egy választott korpuszon (Nagy nyelvi modellek beadandó)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]